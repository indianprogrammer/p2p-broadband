<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none">
  <defs>
    <linearGradient id="bgLight1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f7fbff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#edf5ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="fiberLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0066cc;stop-opacity:0.15" />
      <stop offset="50%" style="stop-color:#0a84ff;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#0066cc;stop-opacity:0.15" />
    </linearGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#0a84ff;stop-opacity:0.25" />
      <stop offset="100%" style="stop-color:#0a84ff;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgLight1)"/>
  
  <!-- Subtle grid pattern -->
  <g opacity="0.045" stroke="#0066cc" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="0" y1="700" x2="1200" y2="700"/>
    <line x1="200" y1="0" x2="200" y2="800"/>
    <line x1="400" y1="0" x2="400" y2="800"/>
    <line x1="600" y1="0" x2="600" y2="800"/>
    <line x1="800" y1="0" x2="800" y2="800"/>
    <line x1="1000" y1="0" x2="1000" y2="800"/>
  </g>
  
  <!-- Soft connection lines -->
  <g stroke="#0a84ff" stroke-width="2" opacity="0.15" fill="none">
    <path d="M100 400 Q300 300 500 400 T900 400 T1100 400"/>
    <path d="M100 420 Q300 320 500 420 T900 420 T1100 420"/>
    <path d="M100 440 Q300 340 500 440 T900 440 T1100 440"/>
  </g>
  
  <!-- Network nodes with soft glow -->
  <circle cx="300" cy="350" r="45" fill="url(#nodeGlow)"/>
  <circle cx="300" cy="350" r="8" fill="#0a84ff" opacity="0.55"/>
  <circle cx="300" cy="350" r="14" fill="none" stroke="#0a84ff" stroke-width="1.5" opacity="0.25"/>
  
  <circle cx="600" cy="400" r="55" fill="url(#nodeGlow)"/>
  <circle cx="600" cy="400" r="10" fill="#0a84ff" opacity="0.7"/>
  <circle cx="600" cy="400" r="18" fill="none" stroke="#0a84ff" stroke-width="1.5" opacity="0.3"/>
  
  <circle cx="900" cy="380" r="40" fill="url(#nodeGlow)"/>
  <circle cx="900" cy="380" r="7" fill="#0a84ff" opacity="0.45"/>
  <circle cx="900" cy="380" r="12" fill="none" stroke="#0a84ff" stroke-width="1.5" opacity="0.2"/>
  
  <!-- Server rack illustration (light) -->
  <g opacity="0.25">
    <rect x="150" y="220" width="80" height="110" rx="6" fill="none" stroke="#0066cc" stroke-width="1.5"/>
    <rect x="160" y="232" width="60" height="8" rx="3" fill="#0066cc" opacity="0.4"/>
    <rect x="160" y="248" width="60" height="8" rx="3" fill="#0066cc" opacity="0.25"/>
    <rect x="160" y="264" width="60" height="8" rx="3" fill="#0066cc" opacity="0.4"/>
    <rect x="160" y="280" width="60" height="8" rx="3" fill="#0066cc" opacity="0.25"/>
    <circle cx="220" cy="236" r="3" fill="#30d158"/>
    <circle cx="220" cy="268" r="3" fill="#30d158"/>
  </g>
  
  <g opacity="0.25">
    <rect x="970" y="200" width="90" height="130" rx="6" fill="none" stroke="#0066cc" stroke-width="1.5"/>
    <rect x="980" y="212" width="70" height="8" rx="3" fill="#0066cc" opacity="0.4"/>
    <rect x="980" y="228" width="70" height="8" rx="3" fill="#0066cc" opacity="0.25"/>
    <rect x="980" y="244" width="70" height="8" rx="3" fill="#0066cc" opacity="0.4"/>
    <rect x="980" y="260" width="70" height="8" rx="3" fill="#0066cc" opacity="0.25"/>
    <rect x="980" y="276" width="70" height="8" rx="3" fill="#0066cc" opacity="0.4"/>
    <circle cx="1045" cy="216" r="3" fill="#30d158"/>
    <circle cx="1045" cy="248" r="3" fill="#30d158"/>
  </g>
  
  <!-- Small data dots -->
  <g fill="#0a84ff" opacity="0.4">
    <circle cx="200" cy="510" r="2.5"/>
    <circle cx="350" cy="560" r="2"/>
    <circle cx="500" cy="530" r="2.5"/>
    <circle cx="650" cy="590" r="2"/>
    <circle cx="800" cy="550" r="2.5"/>
    <circle cx="950" cy="570" r="2"/>
    <circle cx="1100" cy="540" r="2.5"/>
    <circle cx="120" cy="180" r="2"/>
    <circle cx="1120" cy="650" r="2.5"/>
  </g>
  
  <!-- Soft arcs at top -->
  <g stroke="#0a84ff" stroke-width="1.5" fill="none" opacity="0.12">
    <path d="M200 250 Q400 160 600 250"/>
    <path d="M600 250 Q800 160 1000 250"/>
  </g>
</svg>