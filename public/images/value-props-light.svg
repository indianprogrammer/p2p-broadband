<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none">
  <defs>
    <linearGradient id="bgProps1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbfdff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f3f8ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f7f4ff;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glowP1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#0a84ff;stop-opacity:0.12" />
      <stop offset="100%" style="stop-color:#0a84ff;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="glowP2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#30d158;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#30d158;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="glowP3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#8e7cf8;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#8e7cf8;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgProps1)"/>
  
  <!-- Soft glows -->
  <circle cx="150" cy="150" r="260" fill="url(#glowP1)"/>
  <circle cx="1080" cy="200" r="240" fill="url(#glowP2)"/>
  <circle cx="200" cy="700" r="260" fill="url(#glowP3)"/>
  <circle cx="1050" cy="680" r="240" fill="url(#glowP1)"/>
  
  <!-- Subtle Wi-Fi arcs connecting features -->
  <g stroke="#0a84ff" stroke-width="1.5" fill="none" opacity="0.14">
    <path d="M250 250 Q400 180 550 250"/>
    <path d="M550 250 Q700 180 850 250"/>
    <path d="M250 250 Q250 400 350 500"/>
    <path d="M850 250 Q850 400 750 500"/>
    <path d="M550 620 Q400 560 250 500"/>
    <path d="M550 620 Q700 560 850 500"/>
  </g>
  
  <!-- Lightning bolt (Lightning Fast) -->
  <g transform="translate(210,180)" opacity="0.5">
    <path d="M16 0 L0 28 L10 28 L-8 52 L-2 30 L-14 30 Z" fill="#ff9f0a"/>
  </g>
  
  <!-- TV icon (TV & OTT) -->
  <g transform="translate(520,170)" opacity="0.4">
    <rect x="-28" y="-16" width="56" height="36" rx="6" fill="none" stroke="#0a84ff" stroke-width="2"/>
    <line x1="-12" y1="20" x2="0" y2="32" stroke="#0a84ff" stroke-width="2"/>
    <line x1="12" y1="20" x2="0" y2="32" stroke="#0a84ff" stroke-width="2"/>
    <rect x="-16" y="-10" width="20" height="14" rx="3" fill="#0a84ff" opacity="0.35"/>
    <rect x="8" y="-10" width="14" height="14" rx="3" fill="#ff6b9d" opacity="0.35"/>
  </g>
  
  <!-- Shield (Reliable) -->
  <g transform="translate(830,165)" opacity="0.4">
    <path d="M0 -30 L22 -20 L22 2 C22 14 12 24 0 30 C-12 24 -22 14 -22 2 L-22 -20 Z" fill="none" stroke="#30d158" stroke-width="2"/>
    <path d="M-8 -2 L-2 4 L8 -8" stroke="#30d158" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Headphones (Local Support) -->
  <g transform="translate(160,470)" opacity="0.4">
    <path d="M-16 -2 A16 16 0 0 1 16 -2" fill="none" stroke="#8e7cf8" stroke-width="2.5"/>
    <rect x="-22" y="-2" width="8" height="20" rx="3" fill="#8e7cf8" opacity="0.7"/>
    <rect x="14" y="-2" width="8" height="20" rx="3" fill="#8e7cf8" opacity="0.7"/>
  </g>
  
  <!-- Rupee coin (Pricing) -->
  <g transform="translate(550,650)" opacity="0.4">
    <circle cx="0" cy="0" r="26" fill="none" stroke="#0a84ff" stroke-width="2.5"/>
    <text x="0" y="9" text-anchor="middle" fill="#0a84ff" font-size="30" font-weight="600">₹</text>
  </g>
  
  <!-- Router / Wi-Fi (Free Router) -->
  <g transform="translate(840,480)" opacity="0.4">
    <rect x="-34" y="-10" width="68" height="22" rx="7" fill="none" stroke="#ff6b9d" stroke-width="2"/>
    <circle cx="0" cy="1" r="3.5" fill="#ff6b9d"/>
    <path d="M-26 -1 Q-12 -12 0 -12 Q12 -12 26 -1" fill="none" stroke="#ff6b9d" stroke-width="2"/>
    <path d="M-20 -6 Q-8 -16 0 -16 Q8 -16 20 -6" fill="none" stroke="#ff6b9d" stroke-width="2" opacity="0.5"/>
  </g>
  
  <!-- Small floating dots -->
  <g fill="#0a84ff" opacity="0.3">
    <circle cx="120" cy="330" r="2"/>
    <circle cx="1080" cy="360" r="2.5"/>
    <circle cx="380" cy="430" r="2"/>
    <circle cx="720" cy="400" r="2"/>
    <circle cx="1080" cy="90" r="2"/>
    <circle cx="70" cy="600" r="2.5"/>
    <circle cx="1150" cy="550" r="2"/>
  </g>
  
  <!-- Sparkles -->
  <g stroke="#ff9f0a" stroke-width="1.5" opacity="0.3">
    <path d="M620 120 l0 -12 M614 114 l12 0"/>
    <path d="M760 650 l0 -10 M755 645 l10 0"/>
    <path d="M350 620 l0 -10 M345 615 l10 0"/>
  </g>
</svg>