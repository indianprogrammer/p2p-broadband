<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none">
  <defs>
    <linearGradient id="bgSpeed1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f7fbff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#eefbf3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f3f7ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gauge1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a84ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00c7a3;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#0a84ff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#0a84ff;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="glowGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#30d158;stop-opacity:0.13" />
      <stop offset="100%" style="stop-color:#30d158;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgSpeed1)"/>
  
  <!-- Soft glows -->
  <circle cx="600" cy="400" r="320" fill="url(#glowBlue)"/>
  <circle cx="180" cy="180" r="240" fill="url(#glowGreen)"/>
  <circle cx="1050" cy="650" r="260" fill="url(#glowBlue)"/>
  
  <!-- Speed gauge illustration (light, soft) -->
  <g transform="translate(600, 360)">
    <!-- Gauge track -->
    <circle cx="0" cy="0" r="150" fill="none" stroke="#dce8f5" stroke-width="22"/>
    <!-- Gauge arc -->
    <path d="M 0 -150 A 150 150 0 0 1 106 106" fill="none" stroke="url(#gauge1)" stroke-width="22" stroke-linecap="round" opacity="0.55"/>
    <!-- Tick marks -->
    <g stroke="#0a84ff" stroke-width="3" stroke-linecap="round" opacity="0.35">
      <line x1="0" y1="-135" x2="0" y2="-145"/>
      <line x1="-95" y1="-95" x2="-103" y2="-103"/>
      <line x1="95" y1="-95" x2="103" y2="-103"/>
      <line x1="135" y1="0" x2="145" y2="0"/>
    </g>
    <!-- Speed number -->
    <text x="0" y="5" text-anchor="middle" fill="#1d1d1f" font-size="52" font-weight="700">300</text>
    <text x="0" y="34" text-anchor="middle" fill="#0a84ff" font-size="18" font-weight="600">Mbps</text>
  </g>
  
  <!-- Speed comparison bars (light) -->
  <g transform="translate(120, 620)" opacity="0.4">
    <text x="0" y="-8" fill="#86868b" font-size="13">Our Fiber</text>
    <rect x="0" y="0" width="360" height="16" rx="8" fill="#dce8f5"/>
    <rect x="0" y="0" width="360" height="16" rx="8" fill="url(#gauge1)"/>
    <text x="380" y="13" fill="#0a84ff" font-size="13" font-weight="600">300 Mbps</text>
    
    <text x="0" y="48" fill="#86868b" font-size="13">Broadband Avg</text>
    <rect x="0" y="56" width="180" height="16" rx="8" fill="#dce8f5"/>
    <rect x="0" y="56" width="180" height="16" rx="8" fill="#b7c6da"/>
    <text x="196" y="69" fill="#86868b" font-size="13">100 Mbps</text>
    
    <text x="0" y="104" fill="#86868b" font-size="13">Mobile 4G</text>
    <rect x="0" y="112" width="72" height="16" rx="8" fill="#dce8f5"/>
    <rect x="0" y="112" width="72" height="16" rx="8" fill="#c3d0de"/>
    <text x="88" y="125" fill="#86868b" font-size="13">40 Mbps</text>
  </g>
  
  <!-- Float speed dots -->
  <g fill="#0a84ff" opacity="0.35">
    <circle cx="160" cy="300" r="2.5"/>
    <circle cx="1040" cy="240" r="2.5"/>
    <circle cx="300" cy="560" r="2"/>
    <circle cx="930" cy="530" r="2"/>
    <circle cx="120" cy="120" r="2.5"/>
    <circle cx="1100" cy="110" r="2"/>
  </g>
  
  <!-- Motion streak lines -->
  <g stroke="#0a84ff" stroke-width="2" stroke-linecap="round" opacity="0.12">
    <line x1="70" y1="500" x2="180" y2="500"/>
    <line x1="1040" y1="520" x2="1160" y2="520"/>
    <line x1="120" y1="680" x2="240" y2="680" opacity="0.08"/>
  </g>
  
  <!-- Speed bolt accent -->
  <g opacity="0.25">
    <path d="M200 190 L240 190 L225 215 L255 215 L205 250 L220 222 L190 222 Z" fill="#ff9f0a"/>
  </g>
</svg>