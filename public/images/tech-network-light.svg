<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none">
  <defs>
    <linearGradient id="bgTech1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f1f7fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f6f2ff;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glowTech1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#0a84ff;stop-opacity:0.12" />
      <stop offset="100%" style="stop-color:#0a84ff;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="glowTech2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#30d158;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#30d158;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgTech1)"/>
  
  <!-- Soft glows -->
  <circle cx="160" cy="200" r="280" fill="url(#glowTech1)"/>
  <circle cx="1050" cy="360" r="280" fill="url(#glowTech2)"/>
  
  <!-- Layered stack illustration (Backbone → GPON → Router → Devices) -->
  <g transform="translate(480,90)">
    <!-- Layer bars -->
    <rect x="0" y="0" width="240" height="26" rx="13" fill="#0a84ff" opacity="0.14"/>
    <rect x="8" y="5" width="20" height="16" rx="5" fill="#0a84ff" opacity="0.4"/>
    <text x="40" y="18" fill="#0a84ff" font-size="12" font-weight="600">Backbone</text>
    
    <path d="M120 26 L120 40" stroke="#0a84ff" stroke-width="2" opacity="0.2"/>
    <circle cx="120" cy="44" r="4" fill="#0a84ff" opacity="0.25"/>
    
    <rect x="0" y="48" width="240" height="26" rx="13" fill="#30d158" opacity="0.13"/>
    <rect x="8" y="53" width="20" height="16" rx="5" fill="#30d158" opacity="0.4"/>
    <text x="40" y="66" fill="#008c3a" font-size="12" font-weight="600">GPON</text>
    
    <path d="M120 74 L120 88" stroke="#30d158" stroke-width="2" opacity="0.2"/>
    <circle cx="120" cy="92" r="4" fill="#30d158" opacity="0.25"/>
    
    <rect x="0" y="96" width="240" height="26" rx="13" fill="#ff9f0a" opacity="0.13"/>
    <rect x="8" y="101" width="20" height="16" rx="5" fill="#ff9f0a" opacity="0.4"/>
    <text x="40" y="114" fill="#b26a00" font-size="12" font-weight="600">Wi-Fi 6</text>
    
    <path d="M120 122 L120 136" stroke="#ff9f0a" stroke-width="2" opacity="0.2"/>
    <circle cx="120" cy="140" r="4" fill="#ff9f0a" opacity="0.25"/>
    
    <rect x="0" y="144" width="240" height="26" rx="13" fill="#8e7cf8" opacity="0.13"/>
    <rect x="8" y="149" width="20" height="16" rx="5" fill="#8e7cf8" opacity="0.4"/>
    <text x="40" y="162" fill="#5b4cdb" font-size="12" font-weight="600">Devices</text>
  </g>
  
  <!-- Wi-Fi signal arcs radiating from stack -->
  <g stroke="#0a84ff" stroke-width="2" fill="none" opacity="0.16">
    <path d="M360 360 Q600 300 840 360"/>
    <path d="M380 300 Q600 250 820 300"/>
    <path d="M400 250 Q600 210 800 250"/>
  </g>
  
  <!-- Node dots on arcs -->
  <g fill="#0a84ff" opacity="0.3">
    <circle cx="600" cy="252" r="5"/>
    <circle cx="720" cy="292" r="4"/>
    <circle cx="480" cy="292" r="4"/>
    <circle cx="360" cy="360" r="5"/>
    <circle cx="840" cy="360" r="5"/>
  </g>
  
  <!-- Signal strength bars (right) -->
  <g transform="translate(980,540)" fill="#0a84ff" opacity="0.3">
    <rect x="0" y="40" width="12" height="16" rx="3"/>
    <rect x="20" y="28" width="12" height="28" rx="3"/>
    <rect x="40" y="16" width="12" height="40" rx="3"/>
  </g>
  
  <!-- Router icon (left) -->
  <g transform="translate(180,540)" opacity="0.3">
    <rect x="-40" y="-12" width="80" height="24" rx="8" fill="none" stroke="#30d158" stroke-width="2"/>
    <circle cx="0" cy="0" r="4" fill="#30d158"/>
    <path d="M-30 -2 Q-14 -14 0 -14 Q14 -14 30 -2" fill="none" stroke="#30d158" stroke-width="2"/>
    <path d="M-22 -8 Q-9 -20 0 -20 Q9 -20 22 -8" fill="none" stroke="#30d158" stroke-width="2" opacity="0.5"/>
  </g>
  
  <!-- Small dots -->
  <g fill="#0a84ff" opacity="0.22">
    <circle cx="120" cy="140" r="2.5"/>
    <circle cx="1080" cy="120" r="2"/>
    <circle cx="1120" cy="720" r="2.5"/>
    <circle cx="90" cy="760" r="2"/>
    <circle cx="660" cy="560" r="2"/>
  </g>
  
  <!-- Sparkles -->
  <g stroke="#0a84ff" stroke-width="1.5" opacity="0.3">
    <path d="M260 320 l0 -12 M254 314 l12 0"/>
    <path d="M940 320 l0 -12 M934 314 l12 0"/>
  </g>
</svg>